name: SaymonTools Windows
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/SaymonTools.Tests -c Release
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Verify packaged app
        shell: pwsh
        run: |
          $p = Start-Process ./publish/SaymonTools.exe -ArgumentList '--self-test', './self-test' -PassThru -Wait
          Get-Content ./self-test/self-test.txt
          if ($p.ExitCode -ne 0) { throw 'SaymonTools self-test failed' }
      - name: Installer and ZIP
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SaymonTools-Windows
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SaymonTools-previews
          path: self-test
